<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장용액채광(ISL) 비교 시뮬레이터 — 프로토타입</title>
<style>
:root{
  --bg:#15171B; --panel:#1D2026; --panel2:#23272E; --line:#31363F;
  --ink:#E9E5DC; --ink2:#A7AAB2; --ink3:#70747C;
  --ore:#B5652E; --water:#3FA7D6; --liquor:#E0B33C; --alert:#E2574C; --safe:#6FCF97; --inj:#4FC3E8; --prod:#E0A64A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  font-size:13px;line-height:1.6}
.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

#app{display:flex;flex-direction:column;height:100%}
#banner{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:8px 18px;background:#2A1D1B;border-bottom:1px solid #4A302B}
#banner b{color:#E8A598;font-weight:600;font-size:12.5px}
#banner span{color:#9C8480;font-size:12px}

#tabs{display:flex;gap:2px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
#tabs button{border:none;background:transparent;color:var(--ink3);padding:11px 18px;font-size:13px;cursor:pointer;
  font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ore)}
#tabs button:hover{color:var(--ink2)}
#tabs .tag{font-size:10.5px;color:var(--ink3);margin-left:6px;padding:1px 6px;border:1px solid var(--line);border-radius:9px}

#main{flex:1;display:flex;min-height:0;position:relative}
#left{background:var(--panel);width:268px;flex:0 0 268px;overflow-y:auto;border-right:1px solid var(--line)}
#right{background:var(--panel);width:300px;flex:0 0 300px;overflow-y:auto;border-left:1px solid var(--line)}
#stage{flex:1;position:relative;min-width:0;background:#0E1014}
#stage canvas{display:block;position:absolute;top:0;left:0;z-index:1}
#modes,#rightstack,#legend{z-index:5}

.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h3{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:2px}
.sec p.hint{font-size:11.5px;color:var(--ink3);margin-bottom:10px;line-height:1.5}
.field{margin-bottom:13px}
.field label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.field .nm{font-size:12px;color:var(--ink2)}
.field .vl{font-size:12.5px;color:var(--ink)}
.src{font-size:10px;color:var(--ink3);cursor:help;border-bottom:1px dotted var(--ink3)}
input[type=range]{width:100%;accent-color:var(--ore);height:16px}
.seg{display:flex;gap:1px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:none;background:var(--panel2);color:var(--ink3);padding:7px 4px;font-size:11.5px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ore);color:#1A1207}
.tog{display:flex;align-items:flex-start;gap:9px;padding:7px 0;cursor:pointer}
.tog input{margin-top:3px;accent-color:var(--ore);flex:0 0 auto}
.tog .t1{font-size:12px;color:var(--ink)}
.tog .t2{font-size:11px;color:var(--ink3);line-height:1.45}
.tog.danger .t1{color:#E8A598}
.hyp{display:inline-block;font-size:10px;color:#C9A0E8;border:1px solid #5E4A78;border-radius:9px;padding:0 6px;margin-left:5px;vertical-align:middle}

.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dotted #2A2E36}
.kpi:last-child{border-bottom:none}
.kpi .k{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:14px}
.kpi .u{font-size:11px;color:var(--ink3);margin-left:3px}
.big3{display:flex;gap:9px}
.big3 .b{flex:1;text-align:center;padding:10px 3px;background:var(--panel2);border:1px solid var(--line);border-radius:3px}
.big3 .b .lab{font-size:11px;color:var(--ink3);margin-bottom:4px}
.big3 .b .val{font-size:23px;line-height:1.1;color:var(--ink)}
.big3 .b .un{font-size:10.5px;color:var(--ink3);margin-top:2px}
#warn{margin-top:9px;padding:8px 10px;border-radius:3px;font-size:11.5px;background:#2A1D1B;border:1px solid #4A302B;color:#E8A598;display:none}
#warn.on{display:block}

#modes{position:absolute;left:16px;top:16px;display:flex;gap:1px;background:var(--line);border-radius:3px;overflow:hidden}
#modes button{border:none;background:var(--panel2);color:var(--ink3);padding:7px 13px;font-size:11.5px;cursor:pointer;font-family:inherit}
#modes button.on{background:var(--ore);color:#1A1207}
#rightstack{position:absolute;right:16px;top:16px;width:292px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 32px)}
#status{text-align:right;flex:0 0 auto;background:rgba(14,16,20,.88);border:1px solid var(--line);border-radius:3px;padding:11px 13px}
#status .d{font-size:32px;line-height:1;color:var(--ink)}
#status .d i{font-size:13px;color:var(--ink3);font-style:normal;margin-left:3px}
#status .ph{font-size:12.5px;color:var(--liquor);margin-top:5px}
#status .cap{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
#legend{position:absolute;right:16px;bottom:16px;width:312px;max-height:58%;overflow-y:auto;
  background:rgba(14,16,20,.9);border:1px solid var(--line);border-radius:3px;padding:10px 13px 11px}
#legend .grp{display:grid;grid-template-columns:22px 1fr;column-gap:8px;row-gap:3px;align-items:center}
#legend .grp i{margin:0}
#legend .nm{font-size:11.5px;color:var(--ink)}
#legend .nm .role{display:block;margin-left:0;font-size:10.5px;color:var(--ink3);line-height:1.35}
#legend .hd{font-size:11px;color:var(--ink2);font-weight:600;margin:10px 0 5px}
#legend .hd:first-child{margin-top:0}
#legend .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);padding:1px 0}
#legend i{width:18px;height:9px;border-radius:1px;display:inline-block;flex:0 0 auto}
#legend i.ln{height:3px}
#legend i.dsh{height:0;border-top:2px dashed #6E7C8C;background:none !important}
#legend i.dot{width:11px;height:11px;border-radius:50%}
#legend i.tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-radius:0;background:none !important}
#legend .role{font-size:10.5px;color:var(--ink3);margin-left:5px}
#legend .bar2{height:8px;border-radius:2px;border:1px solid #2C3039}
#legend .barlbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3);margin-top:3px}

canvas.mini{width:100%;display:block;background:#171A1F;border:1px solid var(--line);border-radius:3px}
details.notes summary{font-size:12px;color:var(--ink2);cursor:pointer;list-style:none;padding:2px 0}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"+ ";color:var(--ink3)}
details.notes[open] summary::before{content:"− "}
details.notes ul{margin:8px 0 0 0;padding:0;list-style:none}
details.notes li{font-size:11.5px;color:var(--ink3);padding:4px 0 4px 11px;border-left:1px solid var(--line);margin-bottom:2px;line-height:1.5}
details.notes li b{color:var(--ink2);font-weight:500}

#timeline{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:11px 18px;display:flex;align-items:center;gap:16px}
#timeline button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 15px;font-size:12px;border-radius:3px;cursor:pointer;font-family:inherit}
#timeline button:hover{border-color:var(--ore)}
#track{flex:1;height:26px;position:relative}
#track .bar{position:absolute;top:11px;left:0;right:0;height:4px;background:#2C3039;border-radius:2px}
#track .ph1{position:absolute;top:11px;height:4px;background:#3A4450;border-radius:2px}
#track .fill{position:absolute;top:11px;left:0;height:4px;background:var(--ore);border-radius:2px}
#track .tick{position:absolute;top:0;font-size:10px;color:var(--ink3);transform:translateX(-50%)}
#track .tick b{display:block;width:1px;height:7px;background:#3A4450;margin:16px auto 0}
#timeline .sp{display:flex;gap:1px;background:var(--line);border-radius:3px;overflow:hidden}
#timeline .sp button{border:none;border-radius:0;padding:6px 11px;font-size:11.5px;background:var(--panel2);color:var(--ink3)}
#timeline .sp button.on{background:var(--water);color:#08222E}
#timeline .cl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3)}
#timeline .cl input{width:120px;accent-color:var(--water)}

#compare{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:28px 40px}
#compare h2{font-size:17px;font-weight:600;margin-bottom:6px}
#compare p.lead{color:var(--ink2);max-width:760px;margin-bottom:22px;line-height:1.6}
#compare table{width:100%;max-width:960px;border-collapse:collapse;margin-bottom:22px}
#compare th,#compare td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
#compare th{color:var(--ink3);font-weight:500;font-size:11.5px}
#compare td.v{text-align:right;font-size:14px}
#compare td.lbl{color:var(--ink2)}
#compare tr.hl td{background:#1D2026}
#compare .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 18px;font-size:12.5px;border-radius:3px;cursor:pointer;font-family:inherit}
#compare .btn:hover{border-color:var(--ore)}
#compare .take{max-width:960px;margin-top:8px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:3px;line-height:1.6}
#compare .take b{color:var(--liquor);font-weight:500}
#compare .cols{display:flex;gap:18px;max-width:960px;margin-top:18px}
#compare .cols>div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
#compare .cols h4{font-size:12.5px;font-weight:600;margin-bottom:6px}
#compare .cols p{font-size:12px;color:var(--ink2);line-height:1.55}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:#33373F;border-radius:5px}
</style>
</head>
<body>
<div id="app">
  <div id="banner">
    <b>예시용 프로토타입</b>
    <span>거친 근사 모델입니다. 설계·인허가·환경영향평가 근거로 사용할 수 없습니다. 기본값은 공개 문헌 인용치이며 특정 광산의 실측값이 아닙니다.</span>
  </div>
  <div id="tabs">
    <button data-tab="slope" class="on">사면 중력식<span class="tag">이온흡착형 · 동남아/중국</span></button>
    <button data-tab="pattern">정호 패턴식<span class="tag">피압대수층 · 우라늄/구리</span></button>
    <button data-tab="compare">비교</button>
  </div>
  <div id="main">
    <div id="left">
      <div id="ctl-slope" class="ctl"></div>
      <div id="ctl-pattern" class="ctl" hidden></div>
    </div>
    <div id="stage">
      <div id="modes"></div>
      <div id="rightstack">
        <div id="status">
          <div class="d num"><span id="dayv">0</span><i id="dayu">일차</i></div>
          <div class="ph" id="phase">—</div>
          <div class="cap" id="cap2">—</div>
        </div>
      </div>
      <div id="legend"></div>
    </div>
    <div id="right">
      <div class="sec">
        <div class="big3">
          <div class="b"><div class="lab" id="k1l">—</div><div class="val num" id="k1v">—</div><div class="un" id="k1u"></div></div>
          <div class="b"><div class="lab" id="k2l">—</div><div class="val num" id="k2v">—</div><div class="un" id="k2u"></div></div>
          <div class="b"><div class="lab" id="k3l">—</div><div class="val num" id="k3v">—</div><div class="un" id="k3u"></div></div>
        </div>
        <div id="warn"></div>
      </div>
      <div class="sec">
        <h3>시간 이력</h3>
        <p class="hint" id="chart-hint"></p>
        <canvas class="mini" id="chart" width="540" height="290"></canvas>
      </div>
      <div class="sec"><details class="notes"><summary>상세 지표</summary><div id="details" style="margin-top:8px"></div></details></div>
      <div class="sec"><details class="notes"><summary>이 모델이 하지 않는 것</summary><ul id="limits"></ul></details></div>
    </div>
    <div id="compare" hidden></div>
  </div>
  <div id="timeline">
    <button id="play">재생</button>
    <button id="reset">초기화</button>
    <div id="track"><div class="bar"></div><div class="ph1"></div><div class="fill"></div></div>
    <span class="num" id="tl-label" style="color:var(--ink3);font-size:11.5px"></span>
    <div class="sp" id="speed"><button data-s="1" class="on">느리게</button><button data-s="3">보통</button><button data-s="10">빠르게</button></div>
    <div class="cl" id="clipwrap">절개<input type="range" id="s-clip" min="15" max="100" value="45"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   공통 유틸 — DOM 빌더, 색 스케일, 차트, 카메라
   ═══════════════════════════════════════════════════════════ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rgbStr=(r,g,b,a)=>'rgba('+(r*255|0)+','+(g*255|0)+','+(b*255|0)+','+(a===undefined?1:a.toFixed(2))+')';

/* 색 스케일 (모드 키 기반) */
const RAMPS={
  lix:  t=>[0.24+0.06*t, 0.80-0.22*t, 0.86-0.02*t],
  liquor:t=>{ if(t<0.5){const u=t*2; return [0.80+0.10*u,0.62-0.14*u,0.24-0.06*u];}
              const u=(t-0.5)*2; return [0.90,0.48-0.22*u,0.18+0.06*u]; },
  sat:  t=>[0.26-0.14*t, 0.42-0.06*t, 0.70+0.22*t],
  prog: t=>[0.52+0.26*t, 0.42-0.12*t, 0.78-0.06*t],
  head: t=>[0.20+0.55*t, 0.30+0.40*t, 0.62-0.30*t]
};
function ramp(key,t){ t=clamp(t,0,1); return RAMPS[key](t); }
function gradientCSS(key){
  const st=[]; for(let n=0;n<=6;n++){ const r=ramp(key,n/6); st.push(rgbStr(r[0],r[1],r[2])+' '+(n/6*100).toFixed(0)+'%'); }
  return 'linear-gradient(90deg,'+st.join(',')+')';
}

/* ── DOM 빌더 ── */
function uiSection(parent,title,hint){
  const d=document.createElement('div'); d.className='sec';
  d.innerHTML='<h3>'+title+'</h3>'+(hint?'<p class="hint">'+hint+'</p>':'');
  parent.appendChild(d); return d;
}
function uiSlider(parent,o){
  const f=document.createElement('div'); f.className='field';
  f.innerHTML='<label><span class="nm">'+o.label+'</span><span class="vl num"></span></label>'+
    '<input type="range" min="'+o.min+'" max="'+o.max+'" step="'+(o.step||1)+'" value="'+o.val+'">'+
    (o.src?'<div class="src" title="'+o.srcTitle.replace(/"/g,'&quot;')+'">'+o.src+'</div>':'');
  parent.appendChild(f);
  const inp=f.querySelector('input'), vl=f.querySelector('.vl');
  const run=()=>{ const v=+inp.value; vl.textContent=o.fmt(v); o.set(v); };
  inp.addEventListener('input',run); run();
  return inp;
}
function uiToggle(parent,o){
  const l=document.createElement('label'); l.className='tog'+(o.danger?' danger':'');
  l.innerHTML='<input type="checkbox"'+(o.checked?' checked':'')+(o.disabled?' disabled':'')+'>'+
    '<span><span class="t1">'+o.label+(o.hyp?'<span class="hyp">가설</span>':'')+'</span><br><span class="t2">'+o.desc+'</span></span>';
  parent.appendChild(l);
  const inp=l.querySelector('input');
  inp.addEventListener('change',()=>o.set(inp.checked));
  return inp;
}
function uiSegment(parent,o){
  const d=document.createElement('div'); d.className='seg';
  o.options.forEach((op,i)=>{
    const b=document.createElement('button'); b.textContent=op.label; b.dataset.v=op.v;
    if(op.v===o.val) b.classList.add('on');
    b.addEventListener('click',()=>{ d.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); o.set(op.v); });
    d.appendChild(b);
  });
  parent.appendChild(d); return d;
}

/* ── 시계열 차트 ── */
function drawChart(cv,cfg){
  const cc=cv.getContext('2d'), W=cv.width, H=cv.height, P=34;
  cc.clearRect(0,0,W,H); cc.fillStyle='#171A1F'; cc.fillRect(0,0,W,H);
  cc.strokeStyle='#2A2E36'; cc.lineWidth=1;
  for(let g=0;g<=4;g++){ const y=P+(H-P*1.4)*g/4; cc.beginPath(); cc.moveTo(P,y); cc.lineTo(W-8,y); cc.stroke(); }
  const xOf=d=>P+(W-P-8)*(d/cfg.xmax), yOf=v=>P+(H-P*1.4)*(1-clamp(v,0,1));
  cc.strokeStyle='#3A4450'; cc.setLineDash([3,3]);
  (cfg.marks||[]).forEach(m=>{ cc.beginPath(); cc.moveTo(xOf(m.x),P-8); cc.lineTo(xOf(m.x),H-12); cc.stroke(); });
  cc.setLineDash([]);
  cc.fillStyle='#70747C'; cc.font='10px ui-monospace,monospace';
  (cfg.marks||[]).forEach(m=>cc.fillText(m.label,xOf(m.x)+3,H-2));
  cc.fillText('100%',4,P+4); cc.fillText('0',4,H-P*0.4+4);
  if(cfg.ref!==undefined){ cc.strokeStyle='#5A3A38'; cc.setLineDash([2,4]); cc.beginPath(); cc.moveTo(P,yOf(cfg.ref)); cc.lineTo(W-8,yOf(cfg.ref)); cc.stroke(); cc.setLineDash([]); }
  cfg.series.forEach(s=>{
    if(s.pts.length<2) return;
    cc.strokeStyle=s.color; cc.lineWidth=1.7; cc.beginPath();
    s.pts.forEach((p,n)=>{ const x=xOf(p[0]), y=yOf(p[1]); n===0?cc.moveTo(x,y):cc.lineTo(x,y); });
    cc.stroke();
  });
  cc.font='11px -apple-system,sans-serif'; let lx=P+4;
  cfg.series.forEach(s=>{ cc.fillStyle=s.color; cc.fillText(s.name,lx,P-10); lx+=cc.measureText(s.name).width+14; });
}

/* ── 카메라 오빗 ── */
function makeOrbit(camera,el,st){
  const place=()=>{ camera.position.set(st.r*Math.cos(st.b)*Math.sin(st.a),st.r*Math.sin(st.b),st.r*Math.cos(st.b)*Math.cos(st.a)); camera.lookAt(0,0,0); };
  place();
  let drag=false,px=0,py=0,active=()=>true;
  el.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointerup',()=>{drag=false});
  el.addEventListener('pointermove',e=>{ if(!drag||!active()) return;
    st.a-=(e.clientX-px)*0.006; st.b=clamp(st.b+(e.clientY-py)*0.005,0.06,1.45); px=e.clientX; py=e.clientY; place(); });
  el.addEventListener('wheel',e=>{ if(!active()) return; e.preventDefault(); st.r=clamp(st.r*(1+Math.sign(e.deltaY)*0.09),60,600); place(); },{passive:false});
  return {place, setActive:f=>{active=f}};
}

/* ── 3D 이름표 (항상 카메라를 향하는 스프라이트) ── */
function makeLabel(text,color,worldW,bg){
  const cv=document.createElement('canvas'); cv.width=320; cv.height=80; const c=cv.getContext('2d');
  c.clearRect(0,0,320,80);
  c.font='600 30px -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const tw=Math.min(300,c.measureText(text).width+28);
  c.fillStyle=bg||'rgba(14,16,20,0.80)'; c.fillRect(160-tw/2,14,tw,52);
  c.fillStyle=color; c.textAlign='center'; c.textBaseline='middle'; c.fillText(text,160,40);
  const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(worldW,worldW/4,1); sp.renderOrder=20; return sp;
}

/* ═══════════════════════════════════════════════════════════

  if(frame%3===0){ active.drawSection(); refreshUI(); }
  renderer.render(active.scene,active.camera);
}
activate('slope'); resize(); loop();

</script>
